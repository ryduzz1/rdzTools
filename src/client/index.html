<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rdzTools</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">After Effects Preset Panel</p>
          <h1>rdzTools</h1>
          <p class="subtitle">
            Fast text motion, shape looks, and one-click style moves.
          </p>
        </div>
        <button id="refreshSelection" class="ghost">Refresh</button>
      </header>

      <section class="selection">
        <div class="section-title">
          <h2>Selection</h2>
          <span id="hostBadge" class="badge">Loading</span>
        </div>
        <p id="selectionSummary" class="selection-copy">
          Checking After Effects connection...
        </p>
      </section>

      <section class="search-wrap">
        <input id="searchInput" type="search" placeholder="Search presets" />
      </section>

      <main id="presetMount" class="preset-groups"></main>

      <footer class="footer">
        <button id="pingHost" class="ghost">Ping Host</button>
        <p id="statusText">Ready.</p>
      </footer>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
