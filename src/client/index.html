<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rdzTools</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell shell-enter">
      <header class="topbar">
        <div id="tabBar" class="tabbar" role="tablist" aria-label="rdzTools sections">
          <button class="tab-button active" data-tab-id="graphs" role="tab" aria-selected="true">Graphs</button>
          <button class="tab-button" data-tab-id="presets" role="tab" aria-selected="false">Presets</button>
          <button class="tab-button" data-tab-id="tools" role="tab" aria-selected="false">Tools</button>
        </div>
      </header>

      <div id="actionbar" class="actionbar">
        <h1>rdzTools</h1>
        <button id="openGlobalSettings" class="square-settings-button" aria-label="Global settings">
          <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2.05 2.05 0 0 1-2.9 2.9l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.02 1.56V21a2.05 2.05 0 0 1-4.1 0v-.09a1.7 1.7 0 0 0-1.02-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.05 2.05 0 0 1-2.9-2.9l.06-.06A1.7 1.7 0 0 0 4.4 15a1.7 1.7 0 0 0-1.56-1.02H2.75a2.05 2.05 0 0 1 0-4.1h.09A1.7 1.7 0 0 0 4.4 8.86a1.7 1.7 0 0 0-.34-1.87L4 6.93a2.05 2.05 0 0 1 2.9-2.9l.06.06a1.7 1.7 0 0 0 1.87.34 1.7 1.7 0 0 0 1.02-1.56V2.8a2.05 2.05 0 0 1 4.1 0v.09a1.7 1.7 0 0 0 1.02 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2.05 2.05 0 0 1 2.9 2.9l-.06.06a1.7 1.7 0 0 0-.34 1.87 1.7 1.7 0 0 0 1.56 1.02h.09a2.05 2.05 0 0 1 0 4.1h-.09A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
        <button id="applyTool" class="apply">Apply</button>
      </div>

      <main class="list-shell">
        <div id="toolList" class="tool-list"></div>
      </main>
    </div>

    <div id="settingsOverlay" class="overlay hidden">
      <div id="settingsBackdrop" class="overlay-backdrop"></div>
      <section class="settings-sheet">
        <div class="sheet-head">
          <div>
            <p id="sheetGroup" class="sheet-label">Animation</p>
            <h2 id="sheetTitle">Tool Settings</h2>
          </div>
          <button id="closeSettings" class="icon-button" aria-label="Close settings">×</button>
        </div>

        <p id="sheetDescription" class="sheet-copy"></p>
        <div id="fieldMount" class="field-stack"></div>

        <div class="sheet-actions">
          <button id="resetSettings" class="ghost">Reset</button>
          <button id="saveSettings" class="apply">Save</button>
        </div>
      </section>
    </div>

    <div id="globalSettingsOverlay" class="overlay hidden">
      <div id="globalSettingsBackdrop" class="overlay-backdrop"></div>
      <section class="settings-sheet global-settings-sheet">
        <div class="sheet-head">
          <div>
            <p class="sheet-label">Global</p>
            <h2>Global Settings</h2>
          </div>
          <button id="closeGlobalSettings" class="icon-button" aria-label="Close global settings">×</button>
        </div>

        <p class="sheet-copy">Shared preset settings used whenever a preset is applied.</p>
        <div class="field-stack">
          <section class="field-section">
            <div>
              <h3>Timing</h3>
              <p>Controls where preset animation starts.</p>
            </div>
            <div class="field-grid">
              <div class="field">
                <label for="globalStartSec">Animation start (sec or Cursor)</label>
                <input id="globalStartSec" class="text-input" type="text" value="Cursor" />
              </div>
            </div>
          </section>
          <section class="field-section">
            <div>
              <h3>Animation Color</h3>
              <p>Uses this color at the start of in animations and at the end of out animations.</p>
            </div>
            <div class="field-grid">
              <label class="checkbox-field">
                <input id="globalStartColorEnabled" type="checkbox" />
                <span>Enable animation color</span>
              </label>
              <div id="globalStartColorWrap" class="field">
                <label>Color</label>
                <div class="color-picker" data-color-picker>
                  <div id="globalColorSquare" class="color-square">
                    <span id="globalColorSquareHandle" class="color-square-handle" aria-hidden="true"></span>
                  </div>
                  <div id="globalHueBar" class="hue-bar">
                    <span id="globalHueHandle" class="hue-handle" aria-hidden="true"></span>
                  </div>
                </div>
                <input id="globalStartColor" type="hidden" value="#2d8cff" />
              </div>
            </div>
          </section>
        </div>

        <div class="sheet-actions">
          <button id="resetGlobalSettings" class="ghost">Reset</button>
          <button id="saveGlobalSettings" class="apply">Save</button>
        </div>
      </section>
    </div>

    <div id="toolHelpPopup" class="tool-help hidden" role="status" aria-live="polite">
      <div id="toolHelpTitle" class="tool-help-title"></div>
      <div id="toolHelpCopy" class="tool-help-copy"></div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
